<section class="tool-heading"><p class="eyebrow">NR. / LINK STUDIO</p><h1 data-i="title"></h1><p data-i="intro"></p></section>
<div class="workspace"><section class="input-panel" aria-labelledby="input-heading"><div class="panel-heading"><span class="step-number">01</span><h2 id="input-heading" data-i="inputHeading"></h2></div>

<button type="submit" class="button button-primary generate" id="generate"><span data-i="generate"></span><span aria-hidden="true">↗</span></button><p id="message" class="message" role="status" aria-live="polite"></p></form>
